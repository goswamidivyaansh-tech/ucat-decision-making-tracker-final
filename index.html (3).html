<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCAT Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: rgba(31, 33, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #8b92a5;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Syne', sans-serif;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            z-index: -1;
        }
        .orb-1 { width: 300px; height: 300px; background: var(--accent-blue); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent-purple); bottom: -150px; right: -100px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #06b6d4; top: 40%; left: 60%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .container {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Auth Section */
        #auth-section {
            text-align: center;
            display: flex; /* Flex by default, JS will hide it */
            flex-direction: column;
            gap: 20px;
        }

        .gradient-text {
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .google-btn {
            background: white;
            color: black;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Dashboard Section */
        #app-section {
            display: none; /* Hidden by default, JS will show it */
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .logout-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            color: white;
            border-color: white;
        }

        /* Form Elements */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select, input, textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: 'DM Mono', monospace;
            font-size: 1rem;
            width: 100%;
        }

        select option {
            background: var(--bg-color);
            color: white;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .submit-btn {
            background: linear-gradient(to right, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Logs Display */
        .logs-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
        }

        .log-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-family: 'Syne', sans-serif;
            color: var(--accent-blue);
        }

        .log-stats {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .log-notes {
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        /* Custom Scrollbar for logs */
        .logs-container::-webkit-scrollbar { width: 6px; }
        .logs-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .logs-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        
        <div id="auth-section">
            <h1 class="gradient-text">UCAT Track</h1>
            <p style="color: var(--text-muted);">Sign in to sync your reviews across all devices</p>
            
            <button id="google-login-btn" class="google-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 20px;">
                Your data is stored in Firebase Firestore and syncs to every device you sign in on.
            </p>
        </div>


        <div id="app-section">
            <div class="header">
                <h2 class="gradient-text" style="font-size: 1.8rem;">DM Tracker</h2>
                <button id="logout-btn" class="logout-btn">Sign Out</button>
            </div>

            <form id="practice-form" style="display: flex; flex-direction: column; gap: 16px;">
                <div class="form-group">
                    <label for="subtest">Subtest Category</label>
                    <select id="subtest" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="Syllogisms">Syllogisms</option>
                        <option value="Inference (text-based)">Inference (text-based)</option>
                        <option value="Inference (data-based)">Inference (data-based)</option>
                        <option value="Strongest Argument">Strongest Argument</option>
                        <option value="Logic Puzzles">Logic Puzzles</option>
                        <option value="Venn Diagrams">Venn Diagrams</option>
                        <option value="Probability">Probability</option>
                    </select>
                </div>

                <div style="display: flex; gap: 16px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="questions-done">Questions Completed</label>
                        <input type="number" id="questions-done" min="1" required placeholder="e.g. 20">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="score">Score/Correct</label>
                        <input type="number" id="score" min="0" required placeholder="e.g. 15">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Actionable Improvements for Next Time</label>
                    <textarea id="notes" required placeholder="e.g. Need to draw out the Venn diagrams faster, got stuck on conditional 'some' statements."></textarea>
                </div>

                <button type="submit" class="submit-btn">Log Practice Session</button>
            </form>

            <h3 style="margin-top: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Recent Logs</h3>
            <div id="logs-container" class="logs-container">
                </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // YOUR FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAScpq6RdSG1O0Nk9Q1gcw1E8i7_kose0o",
            authDomain: "ucat-tracker.firebaseapp.com",
            projectId: "ucat-tracker",
            storageBucket: "ucat-tracker.firebasestorage.app",
            messagingSenderId: "242021359226",
            appId: "1:242021359226:web:e22eb46dfb655b083c65c3",
            measurementId: "G-JFP29ZYCML"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const loginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const practiceForm = document.getElementById('practice-form');
        const logsContainer = document.getElementById('logs-container');

        let currentUser = null;
        let unsubscribeLogs = null;

        // --- Authentication Logic ---
        
        // Listen for Auth State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                currentUser = user;
                authSection.style.display = 'none';
                appSection.style.display = 'flex';
                loadUserLogs();
            } else {
                // User is signed out
                currentUser = null;
                authSection.style.display = 'flex';
                appSection.style.display = 'none';
                if (unsubscribeLogs) unsubscribeLogs(); // Stop listening to db if logged out
            }
        });

        // Google Sign In
        loginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Error signing in: ", error);
                alert("Sign in failed. Check console for details.");
            }
        });

        // Sign Out
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // --- Database Logic (Firestore) ---

        // Save new log
        practiceForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload

            if (!currentUser) return;

            const subtest = document.getElementById('subtest').value;
            const questionsDone = document.getElementById('questions-done').value;
            const score = document.getElementById('score').value;
            const notes = document.getElementById('notes').value;
            const submitBtn = practiceForm.querySelector('.submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            try {
                await addDoc(collection(db, "practice_logs"), {
                    userId: currentUser.uid,
                    subtest: subtest,
                    questionsDone: parseInt(questionsDone),
                    score: parseInt(score),
                    notes: notes,
                    timestamp: serverTimestamp()
                });
                
                practiceForm.reset(); // Clear the form
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to save log.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Log Practice Session";
            }
        });

        // Load logs in real-time
        function loadUserLogs() {
            if (!currentUser) return;

            // Query: Get logs for this specific user, ordered by newest first
            const q = query(
                collection(db, "practice_logs"), 
                where("userId", "==", currentUser.uid),
                orderBy("timestamp", "desc")
            );

            // onSnapshot listens for real-time updates
            unsubscribeLogs = onSnapshot(q, (snapshot) => {
                logsContainer.innerHTML = ''; // Clear current list
                
                if (snapshot.empty) {
                    logsContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No practice sessions logged yet. Start crushing DM!</p>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Format the date safely
                    let dateString = "Just now";
                    if (data.timestamp) {
                        const date = data.timestamp.toDate();
                        dateString = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    }

                    // Calculate percentage
                    const percentage = Math.round((data.score / data.questionsDone) * 100);

                    // Create HTML element for the log
                    const logElement = document.createElement('div');
                    logElement.className = 'log-card';
                    logElement.innerHTML = `
                        <div class="log-header">
                            <strong>${data.subtest}</strong>
                            <span style="color: var(--text-muted); font-size: 0.8rem;">${dateString}</span>
                        </div>
                        <div class="log-stats">
                            Score: <span style="color: white;">${data.score} / ${data.questionsDone}</span> 
                            (<span style="color: ${percentage >= 70 ? '#34A853' : (percentage >= 50 ? '#FBBC05' : '#EA4335')}">${percentage}%</span>)
                        </div>
                        <div class="log-notes">${data.notes}</div>
                    `;
                    logsContainer.appendChild(logElement);
                });
            });
        }
    </script>
</body>
</html>
